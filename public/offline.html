<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D71920">
  <title>Offline · Nurse Lizzy Health</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5f2;color:#181818;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.card{max-width:560px;background:#fff;padding:36px;border:1px solid #e9e4df;border-radius:18px;box-shadow:0 14px 40px #1717170d}.brand{display:flex;align-items:center;gap:12px;font-weight:750}.brand img{width:48px;height:48px}.eyebrow{color:#d71920;text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:800;margin:32px 0 8px}h1{font-family:Georgia,serif;font-size:36px;line-height:1.15;margin:0 0 14px}p{color:#605d5a;margin:0 0 22px}.button{display:inline-block;background:#d71920;color:white;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/icons/icon-192.png" alt=""><span>Nurse Lizzy Health</span></div>
    <p class="eyebrow">Connection unavailable</p>
    <h1>You’re offline for now.</h1>
    <p>This page needs an internet connection to load. Please reconnect and try again. Your saved app icon and basic offline screen are available until then.</p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
